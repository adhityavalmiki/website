<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal | Adhitya Valmiki</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>
    <link rel="stylesheet" href="../web.css" />
    <script src="../web.js" defer></script>
</head>
<body>
    <div class="page-shell">
        <div class="grid-backdrop" aria-hidden="true"></div>

        <nav class="navbar">
            <div class="nav-inner">
                <a class="brand" href="/">
                    <div class="brand-mark">AV</div>
                    <div class="brand-copy">
                        <strong>Adhitya Valmiki</strong>
                        <span>Offensive Security Portfolio</span>
                    </div>
                </a>
                <button class="hamburger" type="button" onclick="toggleMenu()" aria-label="Toggle navigation">|||</button>
                <ul class="nav-links" id="navLinks">
                    <li><a href="/">Home</a></li>
                    <li><a href="/about/">About</a></li>
                    <li><a href="/projects/">Projects</a></li>
                    <li><a href="/Contact/">Contact</a></li>
                    <li><a href="/terminal/" class="active"><span class="nav-icon">&gt;_</span>Terminal</a></li>
                </ul>
            </div>
        </nav>

        <main class="container section">
            <section class="section">
                <article class="panel terminal-panel terminal-console terminal-console--full">
                    <div class="window-bar">
                        <div class="window-dots"><span></span><span></span><span></span></div>
                        <div class="window-title" id="terminalWindowTitle">root@adhitya:~</div>
                        <div class="status-pill">bash</div>
                    </div>
                    <div class="terminal-body terminal-body--shell terminal-body--linux">
                        <div class="terminal-history" id="terminalHistory" aria-live="polite">
                            <div class="terminal-block">
                                <p class="terminal-line">Linux adhitya 6.8.0-portfolio x86_64 GNU/Linux</p>
                                <p class="terminal-response">Type <strong>help</strong> for available commands.</p>
                            </div>
                            <form class="terminal-input terminal-input--inline" id="terminalForm" autocomplete="off">
                                <label for="terminalCommand" class="terminal-prompt" id="terminalPrompt">root@adhitya:~#</label>
                                <input type="text" id="terminalCommand" aria-label="Terminal command input" spellcheck="false" autofocus />
                            </form>
                        </div>
                    </div>
                </article>
            </section>
        </main>
    </div>
</body>
</html>

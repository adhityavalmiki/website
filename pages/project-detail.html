<div id="page-project-detail" class="page">
  <div class="page-header" id="detail-header">
    <div>
      <button onclick="closeProject()" style="background:none;border:none;color:var(--orange);font-family:var(--mono);font-size:0.7rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;cursor:auto;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;padding:0;">← BACK TO PROJECTS</button>
      <div class="page-title" id="detail-title">PROJECT</div>
    </div>
    <div class="page-subtitle" id="detail-badge-wrap"></div>
  </div>

  <div style="display:grid;grid-template-columns:1.2fr 0.8fr;border-top:3px solid var(--white);">
    <div style="padding:3rem 4rem;border-right:3px solid var(--white);">
      <div class="ablock" style="margin-bottom:1.5rem;">
        <div class="ablock-label">Overview</div>
        <p id="detail-desc" style="color:#aaa;line-height:1.85;font-size:0.88rem;"></p>
      </div>
      <div class="ablock" style="margin-bottom:1.5rem;">
        <div class="ablock-label">How It Works</div>
        <p id="detail-how" style="color:#aaa;line-height:1.85;font-size:0.88rem;"></p>
      </div>
      <div class="ablock">
        <div class="ablock-label">Key Features</div>
        <ul id="detail-features" style="color:#aaa;font-size:0.85rem;line-height:2;padding-left:1.2rem;font-family:var(--mono);"></ul>
      </div>
    </div>

    <div style="padding:3rem;">
      <div style="margin-bottom:1.5rem;">
        <div class="ablock-label" style="font-size:0.58rem;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);margin-bottom:1rem;display:flex;align-items:center;gap:0.6rem;">Languages &amp; Stack<span style="flex:1;height:1px;background:var(--mid);"></span></div>
        <div id="detail-stack" style="display:flex;flex-wrap:wrap;gap:0.5rem;"></div>
      </div>

      <div style="margin-bottom:1.5rem;">
        <div class="ablock-label" style="font-size:0.58rem;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);margin-bottom:1rem;display:flex;align-items:center;gap:0.6rem;">Project Info<span style="flex:1;height:1px;background:var(--mid);"></span></div>
        <div id="detail-meta" style="display:flex;flex-direction:column;gap:0;"></div>
      </div>

      <div id="detail-links" style="display:flex;flex-direction:column;gap:0;margin-top:2rem;"></div>
    </div>
  </div>

</div>
